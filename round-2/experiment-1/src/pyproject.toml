[project]
name = "cox-survival-analysis"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "pandas==2.3.3",
    "lifelines==0.30.3",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "loguru==0.7.3",
    "autograd==1.9.1",
    "autograd-gamma==0.5.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.63.0",
    "formulaic==1.2.2",
    "interface-meta==2.0.1",
    "kiwisolver==1.5.0",
    "narwhals==2.25.0",
    "packaging==26.3",
    "pillow==12.3.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "six==1.17.0",
    "typing-extensions==4.16.0",
    "tzdata==2026.3",
    "wrapt==2.3.0"
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"
